<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061526">
  <title>DAYO — Mobile app</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #061526;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 440px); text-align: center; }
    img { width: 92px; height: 92px; }
    h1 { margin: 20px 0 8px; color: #f7f3d9; letter-spacing: 12px; }
    p { color: #aab7c2; line-height: 1.6; }
    .notice {
      margin-top: 28px;
      padding: 20px;
      border: 1px solid #284257;
      border-radius: 16px;
      background: #10283c;
      text-align: left;
    }
    code { color: #c8f55a; }
  </style>
</head>
<body>
  <main>
    <img src="favicon.svg" alt="DAYO">
    <h1>DAYO</h1>
    <p>Take control of your day.</p>
    <div class="notice">
      <strong>DAYO is now an Expo mobile app.</strong>
      <p>Open a terminal in <code>website/dayo</code> and run <code>npm.cmd start</code>. Scan the QR code with Expo Go to open the real Android or iOS app.</p>
    </div>
  </main>
</body>
</html>

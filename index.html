<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#061526" />
  <title>DAYO — Take control of your day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#101828;--dark:#061526;--lime:#c8f55a;--lime2:#d4ff56;--paper:#f8f9f7;--white:#fff;--ink:#15171a;--muted:#73777f;--line:#e7e9e5;--blue:#dcecf3}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f1f2ef;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.board{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1920px;min-height:100vh;margin:auto;background:var(--paper)}
    .sidebar{position:sticky;top:0;height:100vh;padding:54px 20px 28px;background:radial-gradient(circle at 50% 88%,#12273a 0,transparent 25%),var(--dark);color:#fff;display:flex;flex-direction:column;z-index:2}.brand{text-align:center}.wordmark{font-size:35px;letter-spacing:13px;margin:18px 0 12px;font-weight:600}.tagline{font-size:13px;color:#f8f9f7}.side-section{margin-top:54px}.side-label{font-size:8px;font-weight:700;margin-bottom:16px;color:#f5f6f4}.swatches{display:flex;gap:9px}.swatch-wrap{font-size:6px;text-align:center;color:#dfe4e9}.swatch{width:35px;height:35px;border-radius:8px;border:1px solid rgba(255,255,255,.2);margin-bottom:8px}.type-aa{font-size:47px;line-height:1}.type-name{font-size:16px;margin:6px 0 15px}.weights{display:flex;justify-content:space-between;font-size:7px}.icon-row{display:flex;justify-content:space-between}.icon-row svg{width:17px}.app-icon-wrap{margin-top:auto;text-align:center}.app-icon{width:145px;height:145px;margin:auto;border-radius:37px;background:linear-gradient(145deg,#152a3c,var(--dark));box-shadow:0 8px 28px #000,0 0 34px rgba(200,245,90,.12);display:grid;place-items:center;animation:glow 4s ease-in-out infinite}.app-caption{font-size:11px;margin-top:12px}.logo{width:86px;height:86px}.brand>.logo{width:76px;height:76px}.content{padding:12px 14px 24px;overflow:hidden}.phone-grid{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:15px;align-items:start}.phone-unit{min-width:0}.screen-label{text-align:center;font-size:8px;font-weight:700;margin:4px 0 10px;height:10px}.phone{position:relative;aspect-ratio:390/844;background:#fbfbfa;border:1px solid #dadcd8;border-radius:29px;box-shadow:0 5px 16px rgba(16,24,40,.12);overflow:hidden;transition:transform .25s,box-shadow .25s;animation:rise .6s both;animation-delay:calc(var(--i)*65ms)}.phone:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(16,24,40,.17)}.phone.dark{background:radial-gradient(circle at 50% 50%,#0d253b 0,var(--dark) 67%);color:white}.status{height:34px;padding:11px 18px 0;display:flex;justify-content:space-between;font-size:7px;font-weight:700}.status-icons{letter-spacing:1px}.screen{height:calc(100% - 34px);padding:21px 12px 16px;display:flex;flex-direction:column}.center{text-align:center}.step{font-size:7px;color:var(--muted);margin:1px 0 11px}.title{font-size:14px;line-height:1.35;font-weight:700;margin:0 0 8px}.sub{font-size:7.5px;line-height:1.45;color:#50545a;margin:0}.dark .sub{color:#fff}.btn{height:35px;border:0;border-radius:11px;background:var(--navy);color:#fff;font:600 8px Inter;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:.2s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.lime{background:var(--lime);color:#10170c}.bottom{margin-top:auto}.welcome-logo{width:92px;height:92px;margin:auto auto 12px}.welcome-name{font-weight:600;letter-spacing:8px;font-size:28px;margin:0 0 13px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:25px}.choice{height:85px;border:1px solid var(--line);background:#f7f7f5;border-radius:11px;padding:13px 5px 8px;font-size:7px;font-weight:600;line-height:1.4;text-align:center}.choice svg{display:block;margin:0 auto 12px;width:20px;height:20px}.choice.selected{background:var(--lime);border-color:#bfe94e}.input-stack{margin-top:35px;display:grid;gap:24px}.field-label{font-size:7px;font-weight:600;margin-bottom:7px}.time-field{height:53px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:21px}.time-field svg{width:20px}.select-stack{display:grid;gap:9px;margin-top:20px}.select-card{border:1px solid var(--line);border-radius:11px;min-height:56px;padding:11px 10px;display:grid;grid-template-columns:23px 1fr;gap:7px;align-items:center}.select-card.selected{background:var(--lime);border-color:#bfe94e}.select-card svg{width:18px}.select-card b{display:block;font-size:8px;margin-bottom:4px}.select-card small{display:block;color:#6c7075;font-size:6.5px}.task-input{height:48px;border:1px solid #d9dcd7;border-radius:11px;margin-top:34px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:9px}.task-input span{width:16px;height:16px;border-radius:50%;background:#e9ebe7;color:#777;display:grid;place-items:center}.helper{font-size:6.5px;color:var(--muted);text-align:left;margin:9px 3px}.plan-card,.card{background:#fff;border:1px solid var(--line);border-radius:11px}.plan-card{margin-top:18px}.eyebrow{font-size:7px;font-weight:700;letter-spacing:.05em}.plan-row{min-height:51px;padding:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:13px 1fr auto;gap:8px;align-items:center}.plan-row:last-child{border-bottom:0}.plan-row b{font-size:8px;display:block}.plan-row small{font-size:6.5px;color:#5c6168}.duration{font-size:7px;color:#656a72}.spark{color:#a9d833}.approval{margin-top:auto;text-align:center}.approval b{font-size:8px}.approval p{font-size:6.5px;color:var(--muted);margin:7px 0 12px}.text-btn{text-align:center;font-size:7px;font-weight:600;margin-top:12px}.nav{height:43px;border-top:1px solid var(--line);margin:12px -12px -16px;padding:6px 12px 0;display:flex;align-items:flex-start;justify-content:space-between}.nav-item{font-size:6px;color:#777;text-align:center;min-width:29px}.nav-item svg{width:15px;height:15px;display:block;margin:auto auto 3px}.nav-item.active{color:var(--dark);font-weight:700}.ai-nav{width:31px;height:31px;margin-top:-8px;border-radius:50%;background:var(--dark);color:var(--lime);border:3px solid #fff;outline:1px solid var(--line);display:grid;place-items:center}.ai-nav svg{width:14px}.today-title{font-size:14px;line-height:1.3;margin:0}.today-sub{font-size:7px;color:#62666b;margin:6px 0 18px}.now-card{padding:12px}.now-card .task{font-size:10px;font-weight:700;margin:11px 0 2px}.task-meta{font-size:7px}.now-copy{font-size:6.5px;color:#666;line-height:1.5;margin:12px 0}.now-card .btn{height:30px}.up-next{font-size:8px;font-weight:600;margin:17px 0 8px}.list-row{height:39px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:0 9px;font-size:7.5px}.list-row:last-child{border:0}.list-row svg{width:12px}.list-row span:last-child{font-size:6.5px;color:#74787e}.calendar-head{text-align:center;font-size:11px;font-weight:600;margin-bottom:12px}.week{display:grid;grid-template-columns:repeat(5,1fr);font-size:5.5px;text-align:center;margin-bottom:8px}.week b{display:block;font-size:7px;margin-top:4px}.timeline{position:relative;display:grid;grid-template-columns:34px 1fr;grid-template-rows:repeat(10,22px);font-size:5.5px}.time{grid-column:1;color:#656a70}.event{grid-column:2;background:#f2f2f0;border-radius:7px;padding:5px 8px;font-size:6px;line-height:1.3;margin-bottom:2px}.event.blue{background:var(--blue)}.event.green{background:var(--lime);position:relative}.event.green svg{position:absolute;right:5px;width:10px}.ai-intro{margin-top:32px}.chat-input{height:40px;border:1px solid #d9dcd7;border-radius:10px;margin:40px 0 15px;padding:5px 5px 5px 10px;display:flex;align-items:center;justify-content:space-between;color:#8b8e93;font-size:7px}.send{width:26px;height:26px;border-radius:50%;background:var(--lime);border:0;display:grid;place-items:center}.send svg{width:12px}.ask-label{font-size:7px;margin-bottom:8px}.pills{display:flex;flex-direction:column;align-items:flex-start;gap:7px}.pill{border:1px solid var(--line);border-radius:15px;padding:7px 9px;font-size:6.5px;background:#fff}.chat-header{text-align:center;font-weight:700;font-size:11px;margin:-2px 0 12px}.bubble{max-width:86%;border-radius:10px;padding:10px;font-size:7px;line-height:1.5;margin-bottom:10px;background:#f1f1ef}.bubble.user{margin-left:auto}.proposal{padding:10px;margin-top:2px}.proposal-title{font-size:6px;font-weight:700;margin-bottom:10px}.proposal-row{display:grid;grid-template-columns:1fr auto auto;gap:9px;font-size:6.5px;margin:12px 0}.proposal .btn{height:29px;margin-top:8px}.mini-input{margin-top:9px;height:35px}.focus-screen{padding-top:9px;text-align:center}.focus-pill{align-self:center;background:rgba(200,245,90,.16);color:var(--lime);padding:8px 17px;border-radius:18px;font-size:7px}.timer{font-size:42px;font-weight:600;letter-spacing:4px;margin:30px 0}.focus-task{font-size:12px;font-weight:600;margin:0 0 34px}.focus-copy{font-size:8px;line-height:1.55;color:#e9eef3}.focus-screen .btn{margin-top:auto}.progress-card{padding:13px;margin-top:14px}.percent{font-size:30px;font-weight:700;margin:13px 0 1px}.progress-label{font-size:6px;color:#676b70}.segments{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:14px 0}.segments i{height:14px;border-radius:3px;background:#eceeea}.segments i.on{background:var(--lime)}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:0 -13px -13px}.stat{padding:15px 12px}.stat+ .stat{border-left:1px solid var(--line)}.stat b{font-size:17px}.stat span{font-size:6px;display:block;color:#676b70;margin-top:4px}.insight{text-align:center;padding:16px 12px;margin-top:11px;font-size:7px;line-height:1.5}.insight b{display:block;margin-bottom:12px}.feature-strip{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(5,1fr);padding:18px 9px}.feature{padding:0 18px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;border-right:1px solid var(--line)}.feature:last-child{border:0}.feature svg{width:40px;height:40px;color:#b7e344;stroke-width:1.7}.feature h3{font-size:10px;margin:0 0 8px}.feature p{font-size:7.5px;line-height:1.45;margin:0;color:#35393e}.mobile-brand{display:none}
    @keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes glow{50%{box-shadow:0 8px 28px #000,0 0 45px rgba(200,245,90,.2)}}
    @media(max-width:1250px){.board{grid-template-columns:1fr}.sidebar{display:none}.mobile-brand{display:flex;background:var(--dark);color:white;padding:16px 24px;align-items:center;gap:15px;margin:-12px -14px 18px}.mobile-brand .logo{width:42px;height:42px}.mobile-brand b{letter-spacing:6px}.mobile-brand span{font-size:9px;color:#d8dee4}.phone-grid{grid-template-columns:repeat(3,minmax(210px,1fr))}.feature-strip{grid-template-columns:repeat(2,1fr)}.feature{border-bottom:1px solid var(--line);padding:16px}.feature:nth-child(even){border-right:0}.feature:last-child{border-bottom:0}}
    @media(max-width:720px){.content{padding:10px}.phone-grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:0 2px 18px}.phone-unit{flex:0 0 280px;scroll-snap-align:center}.screen-label{font-size:9px}.feature-strip{grid-template-columns:1fr}.feature{border-right:0;padding:17px}.mobile-brand{margin:-10px -10px 16px}.mobile-brand span{display:none}}
    .btn svg{width:13px;height:13px;flex:0 0 13px}.choice,.select-card,.plan-row,.list-row,.event,.pill,.nav-item,.ai-nav,.task-input,.time-field,.text-btn,.segments i{cursor:pointer;transition:transform .18s,background .18s,opacity .18s}.choice:hover,.select-card:hover,.event:hover,.pill:hover,.list-row:hover{transform:translateY(-2px)}.choice:active,.select-card:active,.event:active,.pill:active,.btn:active{transform:scale(.98)}.event.active,.list-row.active{outline:2px solid var(--lime);outline-offset:1px}.plan-row.done{opacity:.45}.plan-row.done b{text-decoration:line-through}.prototype-toast{position:absolute;left:14px;right:14px;bottom:62px;z-index:20;background:var(--dark);color:#fff;border-radius:10px;padding:10px 12px;text-align:center;font-size:7px;box-shadow:0 8px 24px rgba(6,21,38,.28);animation:toast-in .22s both}.dark .prototype-toast{background:#fff;color:var(--dark)}.chat-reply{margin-top:10px;padding:9px;border-radius:10px;background:#f1f2ef;text-align:left;font-size:7px;line-height:1.45}.edit-ring{outline:2px solid var(--lime);outline-offset:2px}.nav-item:hover,.ai-nav:hover{color:#9ec92d}.nav-item,.ai-nav{user-select:none}.prototype-hint{text-align:center;font-size:8px;color:var(--muted);margin:0 0 10px}.focus-screen.running .focus-pill{box-shadow:0 0 16px rgba(200,245,90,.25)}@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
<main class="board">
  <aside class="sidebar">
    <div class="brand"><div data-logo></div><div class="wordmark">DAYO</div><div class="tagline">Take control of your day.</div></div>
    <section class="side-section"><div class="side-label">COLOR PALETTE</div><div class="swatches" id="swatches"></div></section>
    <section class="side-section"><div class="side-label">TYPOGRAPHY</div><div class="type-aa">Aa</div><div class="type-name">Inter</div><div class="weights"><span>Light</span><span>Regular</span><span>Medium</span><span>Semi Bold</span><span>Bold</span></div></section>
    <section class="side-section"><div class="side-label">ICON STYLE</div><div class="icon-row" data-icons="home,calendar,sparkles,chart,user"></div></section>
    <div class="app-icon-wrap"><div class="app-icon"><div data-logo></div></div><div class="app-caption">APP ICON</div></div>
  </aside>
  <section class="content">
    <header class="mobile-brand"><div data-logo></div><div><b>DAYO</b><br><span>Take control of your day.</span></div></header>
    <div class="phone-grid" id="onboarding"></div>
    <div class="phone-grid" id="core" style="margin-top:30px"></div>
    <div class="feature-strip" id="features"></div>
  </section>
</main>
<script>
const icons={home:'<path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',sparkles:'<path d="m12 3 1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8zM19 16l.8 1.8L22 19l-2.2 1.2L19 22l-.8-1.8L16 19l2.2-1.2z"/>',chart:'<path d="M4 19V5M4 19h17M7 15l4-4 3 2 6-7"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 15a8 8 0 1 1-11-11 7 7 0 0 0 11 11z"/>',brain:'<path d="M9.5 4A3.5 3.5 0 0 0 6 7.5v.2A4 4 0 0 0 5 15v1a3 3 0 0 0 4.5 2.6M14.5 4A3.5 3.5 0 0 1 18 7.5v.2a4 4 0 0 1 1 7.3v1a3 3 0 0 1-4.5 2.6M12 3v18M9 8h3M12 15h3"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',refresh:'<path d="M20 7V3l-2 2a8 8 0 1 0 2 9M4 17v4l2-2"/>',bars:'<path d="M5 20v-6M12 20V8M19 20V3"/>',send:'<path d="m5 4 15 8-15 8 3-8zM8 12h12"/>',play:'<path d="m9 7 8 5-8 5z"/>',pause:'<path d="M9 7v10M15 7v10"/>',check:'<path d="m5 12 4 4L19 6"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',diamond:'<path d="m12 3 4 9-4 9-4-9z"/>'};
function icon(n,c=''){return `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[n]||icons.sparkles}</svg>`}
function logo(){return `<svg class="logo" viewBox="0 0 100 100" fill="none"><path d="M24 18h25c24 0 39 14 39 32S73 82 49 82H24V18Z" stroke="#F7F3D9" stroke-width="5" stroke-linejoin="round"/><path d="M30 77a23 23 0 0 1 46 0H30Z" fill="#D4FF56" stroke="#F7F3D9" stroke-width="3"/><g stroke="#D4FF56" stroke-width="3" stroke-linecap="round"><path d="M53 43v-8M38 48l-5-7M68 48l5-7M32 61l-8-2M74 61l8-2"/></g></svg>`}
function status(){return `<div class="status"><span>9:41</span><span class="status-icons">▮▮ ◉ ▰</span></div>`}
function nav(active=''){return `<nav class="nav">${[['home','Today'],['calendar','Plan']].map(x=>`<div class="nav-item ${active==x[1]?'active':''}">${icon(x[0])}${x[1]}</div>`).join('')}<div class="ai-nav">${icon('sparkles')}</div><div class="nav-item">${icon('chart')}Progress</div><div class="nav-item">${icon('user')}Me</div></nav>`}
function phone(content,label='',dark=false,i=0){return `<article class="phone-unit"><div class="screen-label">${label}</div><div class="phone ${dark?'dark':''}" style="--i:${i}">${status()}${content}</div></article>`}
const planRows=[['sparkles','Finish my portfolio','10:30 – 11:15','45m'],['clock','Lunch','12:00 – 13:00','1h'],['diamond','Study PHP','13:00 – 14:30','1h 30m']];
const onboarding=[
 phone(`<div class="screen center"><div class="welcome-logo">${logo()}</div><h2 class="welcome-name">DAYO</h2><p class="sub">Take control of your day.</p><button class="btn lime bottom">Get started</button></div>`,'',true,0),
 phone(`<div class="screen center"><div class="step">Step 1 of 5</div><h2 class="title">What gets in your way?</h2><p class="sub">This helps DAYO support you better.</p><div class="choices">${[['clock','I procrastinate','selected'],['sun','I get<br>overwhelmed',''],['alert',"I don't know<br>what to prioritize",''],['calendar','I forget things','']].map(x=>`<div class="choice ${x[2]}">${icon(x[0])}${x[1]}</div>`).join('')}</div><button class="btn bottom">Next</button></div>`,'',false,1),
 phone(`<div class="screen center"><div class="step">Step 3 of 5</div><h2 class="title">What time do you usually<br>wake up and go to bed?</h2><p class="sub">This helps DAYO plan your energy.</p><div class="input-stack center" style="text-align:left"><div><div class="field-label">Wake up</div><div class="time-field">07:30 ${icon('sun')}</div></div><div><div class="field-label">Go to bed</div><div class="time-field">23:30 ${icon('moon')}</div></div></div><button class="btn bottom">Next</button></div>`,'',false,2),
 phone(`<div class="screen center"><div class="step">Step 5 of 5</div><h2 class="title">How should DAYO help<br>you plan?</h2><p class="sub">You can change this anytime.</p><div class="select-stack" style="text-align:left">${[['target','Plan everything for me','DAYO creates your whole day.',''],['sparkles','Suggest a plan','DAYO suggests, you decide.','selected'],['list','Mostly let me plan',"You're in control.",'']].map(x=>`<div class="select-card ${x[3]}">${icon(x[0])}<div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div><button class="btn bottom">Next</button></div>`,'',false,3),
 phone(`<div class="screen center"><div class="step">Last step!</div><h2 class="title">What’s one thing you need<br>to get done?</h2><p class="sub">We'll build your first day around it.</p><div class="task-input">Finish my portfolio <span>×</span></div><div class="helper">Be as specific as you want.</div><button class="btn lime bottom">${icon('sparkles')} Create my plan</button></div>`,'',false,4),
 phone(`<div class="screen center"><h2 class="title">Here’s your first plan,<br>Valentijn.</h2><p class="sub">DAYO created this for you.</p><div class="eyebrow" style="text-align:left;margin-top:22px">TODAY</div><div class="plan-card" style="text-align:left">${planRows.map(r=>`<div class="plan-row"><span class="${r[0]=='sparkles'?'spark':''}">${icon(r[0])}</span><div><b>${r[1]}</b><small>${r[2]}</small></div><span class="duration">${r[3]}</span></div>`).join('')}</div><div class="approval"><b>Looks good?</b><p>You can adjust anything later.</p><button class="btn lime">Looks good</button><div class="text-btn">I want to adjust</div></div></div>`,'',false,5)
];
function today(){return `<div class="screen"><h2 class="today-title">Good morning,<br>Valentijn.</h2><p class="today-sub">Let’s make today count.</p><div class="card now-card"><div class="eyebrow">NOW</div><div class="task">Finish my portfolio</div><div class="task-meta">10:30 – 11:15 <span style="float:right">45 min</span></div><p class="now-copy">You have enough time before lunch.<br>Let’s get this done.</p><button class="btn lime">${icon('play')} Start focus</button></div><div class="up-next">Up next</div><div class="card">${[['clock','Lunch','12:00'],['diamond','Study PHP','13:00'],['check','Gym','17:30']].map(r=>`<div class="list-row">${icon(r[0])}<b>${r[1]}</b><span>${r[2]}</span></div>`).join('')}</div><div class="bottom">${nav('Today')}</div></div>`}
function calendar(){let ev=[['Morning routine<br>08:00 – 09:00','2/4',''],['School<br>09:00 – 12:00','4/7','blue'],['Lunch<br>12:00 – 13:00','7/8',''],[`Finish my portfolio ${icon('sparkles')}<br>13:00 – 16:00`,'8/10','green'],['Free time<br>16:00 – 17:00','10/11',''],['Gym<br>17:30 – 18:30','11/12','blue']];return `<div class="screen"><div class="calendar-head">August 10</div><div class="week">${['MON|10','TUE|11','WED|12','THU|13','FRI|14'].map(x=>{let p=x.split('|');return `<span>${p[0]}<b>${p[1]}</b></span>`}).join('')}</div><div class="timeline">${['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map((t,i)=>`<span class="time" style="grid-row:${i+1}">${t}</span>`).join('')}${ev.map(e=>`<div class="event ${e[2]}" style="grid-row:${e[1]}">${e[0]}</div>`).join('')}</div><div class="bottom">${nav('Plan')}</div></div>`}
function ai(){return `<div class="screen center"><div class="ai-intro"><h2 class="title">DAYO</h2><p class="sub">How can I help you today?</p></div><div class="chat-input">Tell DAYO anything...<button class="send">${icon('send')}</button></div><div class="ask-label" style="text-align:left">Try asking:</div><div class="pills">${['I have an assignment Friday','Plan my afternoon','I’m behind today','I can’t get started'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="bottom">${nav('')}</div></div>`}
function planning(){return `<div class="screen"><div class="chat-header">DAYO</div><div class="bubble user">I need to finish my report for Friday and I still have about 4 hours of work left.</div><div class="bubble">Got it. You have 4 hours of work left and the deadline is Friday. I’ve found three good blocks in your schedule.</div><div class="card proposal"><div class="proposal-title">PROPOSED PLAN</div>${[['Today','16:00 – 17:00','1h'],['Wednesday','14:30 – 16:00','1.5h'],['Thursday','15:00 – 16:30','1.5h']].map(r=>`<div class="proposal-row"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}<button class="btn lime">Add to my plan</button></div><div class="chat-input mini-input bottom">Ask DAYO anything...<button class="send">${icon('send')}</button></div>${nav('')}</div>`}
function focus(){return `<div class="screen focus-screen"><div class="focus-pill">Focus</div><div class="timer">32:18</div><div class="focus-task">Finish my portfolio</div><div class="focus-copy">You’re doing the<br>right thing right now.</div><button class="btn lime">${icon('pause')} Pause</button><div class="text-btn" style="margin:15px 0 28px">Give up</div></div>`}
function progress(){return `<div class="screen"><h2 class="title" style="text-align:left;margin:12px 0 4px">Your progress</h2><div class="card progress-card"><div class="eyebrow">This week</div><div class="percent">82%</div><div class="progress-label">planned tasks completed</div><div class="segments">${Array.from({length:7},(_,i)=>`<i class="${i<6?'on':''}"></i>`).join('')}</div><div class="stats"><div class="stat"><b>12</b><span>focus sessions</span></div><div class="stat"><b>6h 45m</b><span>focused time</span></div></div></div><div class="card insight"><b>You’re most productive<br>between 10:00 and 13:00.</b>DAYO will keep this in mind<br>when planning your days.</div><div class="bottom">${nav('Progress')}</div></div>`}
const core=[phone(today(),'TODAY SCREEN',false,0),phone(calendar(),'PLAN / CALENDAR SCREEN',false,1),phone(ai(),'DAYO AI SCREEN',false,2),phone(planning(),'AI PLANNING EXAMPLE',false,3),phone(focus(),'FOCUS MODE SCREEN',true,4),phone(progress(),'PROGRESS SCREEN',false,5)];
const feats=[['sparkles','AI PLANNING','DAYO creates a realistic plan based on your tasks, time and energy.'],['refresh','SMART ADAPTATION','If something changes, DAYO adapts your day and keeps you on track.'],['brain',"I’M STUCK","DAYO helps you start when you’re stuck and builds momentum."],['target','FOCUS MODE','Distraction-free focus sessions to help you get things done.'],['bars','REAL PROGRESS',"Track your progress and see how you’re improving over time."]];
document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo());document.querySelectorAll('[data-icons]').forEach(x=>x.innerHTML=x.dataset.icons.split(',').map(icon).join(''));document.getElementById('swatches').innerHTML=['#101828','#C8F55A','#F8F9F7','#FFFFFF','#73777F'].map(c=>`<div class="swatch-wrap"><div class="swatch" style="background:${c}"></div>${c}</div>`).join('');document.getElementById('onboarding').innerHTML=onboarding.join('');document.getElementById('core').innerHTML=core.join('');document.getElementById('features').innerHTML=feats.map(f=>`<div class="feature">${icon(f[0])}<div><h3>${f[1]}</h3><p>${f[2]}</p></div></div>`).join('');

// Shared interaction layer: the presentation board doubles as a complete clickable MVP.
const onboardPhones=[...document.querySelectorAll('#onboarding .phone-unit')];
const corePhones=[...document.querySelectorAll('#core .phone-unit')];
const prototype={task:'Finish my portfolio',wake:'07:30',sleep:'23:30',focusSeconds:32*60+18,running:false,timer:null};
function goTo(el){el?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});el?.querySelector('.phone')?.animate([{transform:'translateY(-4px)',boxShadow:'0 14px 30px rgba(16,24,40,.2)'},{transform:'translateY(0)'}],{duration:500,easing:'ease-out'})}
function toast(phone,message){phone.querySelector('.prototype-toast')?.remove();const note=document.createElement('div');note.className='prototype-toast';note.textContent=message;phone.append(note);setTimeout(()=>note.remove(),1800)}
function buttonText(el){return el.textContent.replace(/\s+/g,' ').trim().toLowerCase()}
function syncTask(name){prototype.task=name||'Finish my portfolio';document.querySelectorAll('.task,.focus-task,.plan-row b').forEach(el=>{if(/finish my portfolio/i.test(el.textContent))el.textContent=prototype.task});document.querySelectorAll('.task-input').forEach(el=>{el.childNodes[0].textContent=prototype.task+' '})}
function openTaskEditor(phone){const value=prompt('What is one thing you need to get done?',prototype.task);if(value&&value.trim()){syncTask(value.trim());toast(phone,'Task saved') }}
function addAiReply(phone,promptText){let reply=phone.querySelector('.chat-reply');if(!reply){reply=document.createElement('div');reply.className='chat-reply';phone.querySelector('.pills')?.after(reply)}reply.innerHTML=`<b>${promptText}</b><br><br>DAYO has found a calm, realistic next step. I’ll protect one focused block and keep the rest of your day flexible.`;toast(phone,'DAYO updated your plan')}
function askDayo(phone,seed=''){const question=prompt('Tell DAYO anything…',seed);if(question&&question.trim())addAiReply(phone,question.trim())}
function renderTimer(phone){const n=prototype.focusSeconds,m=String(Math.floor(n/60)).padStart(2,'0'),s=String(n%60).padStart(2,'0');phone.querySelector('.timer').textContent=`${m}:${s}`}
function toggleFocus(phone){prototype.running=!prototype.running;phone.querySelector('.focus-screen').classList.toggle('running',prototype.running);const btn=phone.querySelector('.focus-screen .btn');btn.innerHTML=prototype.running?`${icon('pause')} Pause`:`${icon('play')} Resume`;clearInterval(prototype.timer);if(prototype.running)prototype.timer=setInterval(()=>{if(prototype.focusSeconds>0){prototype.focusSeconds--;renderTimer(phone)}else{clearInterval(prototype.timer);prototype.running=false;toast(phone,'Focus session complete!')}},1000)}
document.querySelectorAll('.time-field').forEach((field,i)=>field.addEventListener('click',()=>{const values=i===0?['07:30','08:00','08:30','09:00']:['22:30','23:00','23:30','00:00'];const current=i===0?prototype.wake:prototype.sleep;const next=values[(values.indexOf(current)+1)%values.length];if(i===0)prototype.wake=next;else prototype.sleep=next;field.childNodes[0].textContent=next+' ';toast(field.closest('.phone'),`${i===0?'Wake-up':'Bedtime'} set to ${next}`)}));
document.addEventListener('click',event=>{
  const phone=event.target.closest('.phone');if(!phone)return;
  const choice=event.target.closest('.choice');if(choice){choice.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));choice.classList.add('selected');toast(phone,'Preference selected');return}
  const select=event.target.closest('.select-card');if(select){select.parentElement.querySelectorAll('.select-card').forEach(x=>x.classList.remove('selected'));select.classList.add('selected');toast(phone,'Planning style selected');return}
  const taskInput=event.target.closest('.task-input');if(taskInput){openTaskEditor(phone);return}
  const row=event.target.closest('.plan-row');if(row){row.classList.toggle('done');toast(phone,row.classList.contains('done')?'Task marked complete':'Task restored');return}
  const listRow=event.target.closest('.list-row');if(listRow){listRow.parentElement.querySelectorAll('.list-row').forEach(x=>x.classList.remove('active'));listRow.classList.add('active');toast(phone,`${listRow.querySelector('b').textContent} selected`);return}
  const eventCard=event.target.closest('.event');if(eventCard){eventCard.classList.toggle('active');toast(phone,eventCard.textContent.replace(/\s+/g,' ').trim());return}
  const pill=event.target.closest('.pill');if(pill){askDayo(phone,pill.textContent);return}
  const segment=event.target.closest('.segments i');if(segment){segment.classList.toggle('on');const all=[...segment.parentElement.children],done=all.filter(x=>x.classList.contains('on')).length;phone.querySelector('.percent').textContent=Math.round(done/all.length*100)+'%';toast(phone,'Weekly progress updated');return}
  const navItem=event.target.closest('.nav-item,.ai-nav');if(navItem){const label=buttonText(navItem);if(navItem.classList.contains('ai-nav'))goTo(corePhones[2]);else if(label.includes('today'))goTo(corePhones[0]);else if(label.includes('plan'))goTo(corePhones[1]);else if(label.includes('progress'))goTo(corePhones[5]);else toast(phone,'Profile is ready for the next iteration');return}
  const send=event.target.closest('.send');if(send){askDayo(phone);return}
  const button=event.target.closest('.btn,.text-btn');if(!button)return;const text=buttonText(button);
  if(text.includes('get started'))goTo(onboardPhones[1]);
  else if(text==='next'){const index=onboardPhones.findIndex(x=>x.contains(phone));goTo(onboardPhones[Math.min(index+1,onboardPhones.length-1)])}
  else if(text.includes('create my plan')){toast(phone,'Your first plan is ready');setTimeout(()=>goTo(onboardPhones[5]),350)}
  else if(text==='looks good'){toast(phone,'Plan approved — welcome to DAYO');setTimeout(()=>goTo(corePhones[0]),350)}
  else if(text.includes('want to adjust'))goTo(onboardPhones[4]);
  else if(text.includes('start focus')){prototype.running=false;goTo(corePhones[4]);setTimeout(()=>toggleFocus(corePhones[4].querySelector('.phone')),450)}
  else if(text.includes('pause')||text.includes('resume'))toggleFocus(phone);
  else if(text.includes('give up')){prototype.running=false;clearInterval(prototype.timer);prototype.focusSeconds=32*60+18;renderTimer(phone);phone.querySelector('.focus-screen').classList.remove('running');phone.querySelector('.focus-screen .btn').innerHTML=`${icon('play')} Resume`;toast(phone,'Session ended — no judgment');setTimeout(()=>goTo(corePhones[0]),500)}
  else if(text.includes('add to my plan')){button.textContent='Added to plan ✓';button.disabled=true;toast(phone,'Three focus blocks added');setTimeout(()=>goTo(corePhones[1]),550)}
});
</script>
</body>
</html>
